name: Minecraft compatibility builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.10", "1.21.11", "26.1", "26.1.1", "26.1.2", "26.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and verify Mixin targets
        run: python3 scripts/build_versions.py --version '${{ matrix.minecraft }}'
      - uses: actions/upload-artifact@v7
        with:
          name: Chat-LLM-Translation-mc${{ matrix.minecraft }}
          path: build/versions/${{ matrix.minecraft }}/*.jar
          if-no-files-found: error
